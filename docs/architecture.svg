<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 455" width="980" height="455" role="img" aria-label="FathomKernel architecture">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="36" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="650" fill="#111827">FathomKernel DSH plugin — optimization loop</text>
<text x="40" y="56" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6b7280">JustGoal → milestones → multi-scale proposal → real measurement → promotion → structured memory → self-evolution</text>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/></marker></defs>
<rect x="40" y="84" width="250" height="92" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
<text x="54" y="108" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">1 · JustGoal</text>
<text x="54" y="129" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">goal + acceptance commands + metric</text>
<rect x="40" y="206" width="250" height="92" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="1.4"/>
<text x="54" y="230" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">2 · Milestone ladder</text>
<text x="54" y="251" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">compile → correct → baseline</text>
<rect x="40" y="328" width="250" height="70" rx="10" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.4"/>
<text x="54" y="352" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">3 · Knowledge retrieval</text>
<text x="54" y="373" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">patterns / antipatterns / insights</text>
<rect x="365" y="84" width="250" height="92" rx="10" fill="#f8fafc" stroke="#0891b2" stroke-width="1.4"/>
<text x="379" y="108" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">4 · Multi-scale proposer</text>
<text x="379" y="129" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">LLM · agent · command · manual</text>
<rect x="365" y="206" width="250" height="92" rx="10" fill="#f8fafc" stroke="#0891b2" stroke-width="1.4"/>
<text x="379" y="230" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">5 · Pristine sandbox</text>
<text x="379" y="251" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">copy template · write entry · hash</text>
<rect x="365" y="328" width="250" height="70" rx="10" fill="#f8fafc" stroke="#0891b2" stroke-width="1.4"/>
<text x="379" y="352" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">6 · Build / check / bench</text>
<text x="379" y="373" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">repeated median · MAD · CV</text>
<rect x="690" y="84" width="250" height="92" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
<text x="704" y="108" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">7 · Promotion gate</text>
<text x="704" y="129" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">correct &amp;&amp; faster than best</text>
<rect x="690" y="206" width="250" height="92" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
<text x="704" y="230" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">8 · Structured memory</text>
<text x="704" y="251" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">KB confidence + bandit policy</text>
<rect x="690" y="328" width="250" height="70" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.4"/>
<text x="704" y="352" font-family="Inter, sans-serif" font-size="13" font-weight="650" fill="#111827">9 · Cross-task meta</text>
<text x="704" y="373" font-family="Inter, sans-serif" font-size="11" fill="#4b5563">scale priors for the next goal</text>
<line x1="290" y1="130" x2="365" y2="130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="327.5" y="124.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">propose</text>
<line x1="165" y1="176" x2="165" y2="206" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="165.0" y="185.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">verify</text>
<path d="M 290 363 L 320 363 L 320 150 L 365 150" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/><text x="326" y="270" font-family="Inter, sans-serif" font-size="10" fill="#64748b">retrieve</text>
<line x1="490" y1="176" x2="490" y2="206" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="490.0" y="185.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">evaluate</text>
<line x1="490" y1="298" x2="490" y2="328" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="490.0" y="307.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">measure</text>
<line x1="615" y1="363" x2="690" y2="363" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="652.5" y="357.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">feedback</text>
<line x1="815" y1="328" x2="815" y2="298" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="815.0" y="307.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">learn</text>
<line x1="815" y1="206" x2="815" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="815.0" y="185.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">promote</text>
<line x1="690" y1="130" x2="615" y2="130" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="652.5" y="124.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">accept</text>
<line x1="815" y1="298" x2="940" y2="298" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="877.5" y="292.0" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">reuse</text>
<path d="M 940 298 Q 970 298 970 240 T 940 130" fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="40" y="424" font-family="Inter, sans-serif" font-size="11" fill="#6b7280">Every candidate is compiled, correctness-checked and benchmarked on the real machine; harness edits are hash-rejected.</text>
<text x="40" y="441" font-family="Inter, sans-serif" font-size="11" fill="#6b7280">Memory and policy are persisted per goal, with a global meta-policy supplying cross-task scale priors.</text>
</svg>